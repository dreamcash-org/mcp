# Publishes @dreamcash-org/mcp to npm when Dreamcash's monorepo pushes a
# release here with its tag. This file is written by that release: change it
# in the monorepo (packages/dreamcash-mcp/release-repo), not here.
name: Publish to npm

permissions:
  contents: read
  # npm trusted publishing: npm checks this repository and workflow
  id-token: write

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@11

      - name: The tag names this version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json ${version}" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
